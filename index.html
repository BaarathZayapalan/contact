<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>

  <main class="contact-card">
    <h1>Contact Us</h1>

    <form id="contactForm" novalidate>

      <div class="name-row">
        <div class="form-group">
          <label for="firstName">
            First Name <span class="required">*</span>
          </label>
          <input type="text" id="firstName" name="firstName"
                 autocomplete="given-name">
          <small class="error" id="firstNameError"></small>
        </div>

        <div class="form-group">
          <label for="lastName">
            Last Name <span class="required">*</span>
          </label>
          <input type="text" id="lastName" name="lastName"
                 autocomplete="family-name">
          <small class="error" id="lastNameError"></small>
        </div>
      </div>

      <div class="form-group email-group">
        <label for="email">
          Email Address <span class="required">*</span>
        </label>
        <input type="email" id="email" name="email"
               autocomplete="email">
        <small class="error" id="emailError"></small>
      </div>

      <fieldset class="query-group" id="queryGroup">
        <legend>
          Query Type <span class="required">*</span>
        </legend>

        <div class="query-row">
          <label class="query-option" for="general">
            <input type="radio" id="general" name="queryType"
                   value="General Enquiry">
            <span>General Enquiry</span>
          </label>

          <label class="query-option" for="support">
            <input type="radio" id="support" name="queryType"
                   value="Support Request">
            <span>Support Request</span>
          </label>
        </div>

        <small class="error" id="queryError"></small>
      </fieldset>

      <div class="form-group message-group">
        <label for="message">
          Message <span class="required">*</span>
        </label>
        <textarea id="message" name="message" rows="4"></textarea>
        <small class="error" id="messageError"></small>
      </div>

      <div class="consent-group" id="consentGroup">
        <input type="checkbox" id="consent" name="consent">
        <label for="consent">
          I consent to being contacted by the team
          <span class="required">*</span>
        </label>
      </div>

      <small class="error consent-error" id="consentError"></small>

      <button type="submit" id="submitButton">Submit</button>

      <p id="successMessage" class="success-message"
         role="status" aria-live="polite"></p>

    </form>
  </main>

</body>
</html>
